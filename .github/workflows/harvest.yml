# Nightly harvest of the NY open data catalog index.
#
# NOT ENABLED. The schedule is commented out and this repo has not been pushed anywhere.
# Turning it on is a separate decision (Noel). When enabled it:
#   1. builds the package and runs the offline tests,
#   2. downloads the previous index from the index-latest release (so first_seen / whats_new
#      carry over and unchanged ArcGIS layers are skipped),
#   3. runs `ny-data-registry harvest` (read-only, throttled, robots.txt honored),
#   4. runs the question set against the new index, and
#   5. publishes ny-data-index.sqlite.gz + SHA256SUMS + harvest stats to index-latest,
#      the fixed release the server downloads on first run.
name: harvest

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 7 * * *"   # 07:17 UTC daily (02:17 / 03:17 New York)

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NY_DATA_CACHE_DIR: ${{ github.workspace }}/.cache
      NY_DATA_INDEX: ${{ github.workspace }}/.cache/ny-data-index.sqlite
      # Optional: a Socrata app token raises the shared-pool throttle limit.
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm test
      - name: Fetch previous index (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          if gh release download index-latest --pattern ny-data-index.sqlite.gz --dir .cache; then
            gunzip -f .cache/ny-data-index.sqlite.gz
          else
            echo "no previous index"
          fi
      - name: Harvest
        run: node dist/cli.js harvest --stats-out .cache/harvest-stats.json
      - name: Question set
        run: node dist/cli.js eval --out .cache/eval.md || echo "question set below target; see eval.md"
      - name: Publish index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fold the WAL into the main file, so the published .sqlite is complete on its own.
          node -e 'const { DatabaseSync } = require("node:sqlite"); const d = new DatabaseSync(process.argv[1]); d.exec("PRAGMA wal_checkpoint(TRUNCATE)"); d.close();' .cache/ny-data-index.sqlite
          cd .cache
          gzip -9 -k -f ny-data-index.sqlite
          # Servers check both sums before installing; keep both lines.
          sha256sum ny-data-index.sqlite.gz ny-data-index.sqlite > SHA256SUMS
          gh release view index-latest >/dev/null 2>&1 || gh release create index-latest --latest=false --title "Latest harvested index" --notes "Rebuilt by the harvest workflow."
          gh release upload index-latest ny-data-index.sqlite.gz SHA256SUMS harvest-stats.json eval.md --clobber
