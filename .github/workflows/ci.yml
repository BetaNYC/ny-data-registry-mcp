# Offline tests at both ends of the declared Node range (engines: >=22.16; older official builds lack SQLite FTS5).
# Not active until the repo is pushed; no network is used by the tests.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.16.0", "26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  # The What's changed standard (betanyc-ai-workspace
  # platform/system/whats-changed-standard.md § 10). scripts/whats_changed.py is a copy of the
  # workspace's canonical file: never edit it here. `check --base-ref` needs the base branch's
  # history (fetch-depth: 0): old entries are append-only, and a package.json version bump
  # needs an MCP entry naming the new version. No website, so no page check. Stdlib only.
  whats-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"

  # The about-data standard (betanyc-ai-workspace platform/system/about-data-standard.md § 7).
  # scripts/whats_changed.py, scripts/tests/catalog_validate.py, scripts/mcp_shared/ and
  # src/betanyc-tools.ts are copies of the workspace's canonical files: never edit them here.
  # 1. DATA-SOURCES.json is valid and every tool the built server lists has a source.
  # 2. data.json (DCAT-US 3.0) matches DATA-SOURCES.json; rebuild with the same command
  #    without --check. 3. DATA-SOURCES.json against its JSON Schema and data.json against the
  #    vendored DCAT-US 3.0 schema, with pinned validators (CI only, not runtime dependencies).
  # The release gate (`about-data check --release`) runs in release.yml before `npm publish`.
  # Listing the tools imports dist/tools.js, which makes no request.
  about-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: npm ci && npm run build
      - name: The server's tool list
        run: >-
          node --input-type=module -e '
          const { TOOLS } = await import("./dist/tools.js");
          console.log(JSON.stringify(TOOLS.map((t) => t.name)));
          ' > "$RUNNER_TEMP/tools.json"
        env:
          NY_DATA_OFFLINE: "1"
          NY_DATA_REGISTRY_REFRESH: "0"
      - name: DATA-SOURCES.json is valid and explains every tool
        run: python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --tools-file "$RUNNER_TEMP/tools.json"
      - name: data.json is current
        run: python3 scripts/whats_changed.py about-data catalog DATA-SOURCES.json --check
      - name: Validate against the JSON Schema and DCAT-US 3.0
        run: |
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py data-sources DATA-SOURCES.json
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py dcat data.json
