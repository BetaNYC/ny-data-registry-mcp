# Release automation for ny-data-registry-mcp.
#
# Publishes @betanyc/ny-data-registry-mcp to npm and creates a GitHub Release
# whenever a version tag (v*) is pushed. Same shape as the other BetaNYC
# MCP repos.
#
# Flow: push a tag like v1.0.1 → this workflow checks the tag matches
# package.json's version, runs tests (if present), publishes to npm with
# provenance, and creates a GitHub Release with auto-generated notes.
#
# Prerequisite: an NPM_TOKEN repository secret (npm automation token with
# publish rights on @betanyc/ny-data-registry-mcp). id-token: write enables npm
# provenance attestation; contents: write lets the workflow create the
# GitHub Release.
#
# The code release is created with --latest=false. The dataset index lives in
# its own fixed release, index-latest, which the server downloads on first run;
# code releases must never hold or shadow it.
#
# Before tagging: one commit dates the WHATS-CHANGED.md "## Unreleased:" entry and the
# CHANGELOG.md heading with the same New York date, and adds the dated anchor to the entry's
# MCP version link. Tag that commit. Full steps: README, "Releases". The "WHATS-CHANGED.md has
# no Unreleased entry" step below enforces the dating.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Verify server.json versions match package.json
        run: |
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            const bad = [s.version, ...s.packages.map((x) => x.version)].filter((v) => v !== p.version);
            if (bad.length || s.name !== p.mcpName) { console.error("server.json is out of step with package.json"); process.exit(1); }
          '

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # WHATS-CHANGED.md: the version bump's entry is "## Unreleased: Title" until the release
      # commit dates it ("## YYYY-MM-DD: Title", same title). This fails while one is left.
      # scripts/whats_changed.py is a copy of the workspace's canonical file; never edit it.
      - name: WHATS-CHANGED.md has no Unreleased entry
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --release

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
